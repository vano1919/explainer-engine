job: extension
config:
  name: "xworld_style_v1"
  process:
    - type: 'diffusion_trainer'
      training_folder: "/workspace/output"
      device: cuda:0
      trigger_word: "xworld style"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 8
      datasets:
        - folder_path: "/workspace/ds/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          num_repeats: 1
          cache_latents_to_disk: true
          resolution: [1024]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2000
        gradient_accumulation: 1
        timestep_type: "weighted"
        content_or_style: "balanced"
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "Qwen/Qwen-Image-2512"
        arch: "qwen_image"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
      sample:
        sampler: "flowmatch"
        sample_every: 500
        width: 1024
        height: 576
        samples:
          - prompt: "xworld style, ancient Rome forum at noon, a senator trips over his toga mid-speech while a baker laughs, thin lanky figures, harsh sun, marble columns"
          - prompt: "xworld style, ice age tundra at dusk, a man in a modern parka slips off a mammoth's back, his friends gasp, campfire glow, a yellow bus stuck in snow"
          - prompt: "xworld style, Napoleon's army tent at night, a general spills ink over the battle map while his aide winces, candle light, sabres on the table"
          - prompt: "xworld style, a medieval market street in the rain, a knight's horse eats a merchant's cabbages, the merchant screams, lantern light, wet cobbles"
          - prompt: "xworld style, wide establishing shot, camera at eye level, 35mm lens, the left third of the frame shows a city bus, the right third shows four passengers standing in a row facing the camera, a nurse in blue scrubs, a bearded worker in an orange vest, a pink-haired girl with headphones, a bald old man with glasses, flat grey daylight, tundra, snow, mountains far behind, the bus is yellow, the passengers look worried, everyone stands still, keyframe for animation"
          - prompt: "ancient Rome forum at noon, a senator trips over his toga mid-speech while a baker laughs, thin lanky figures, harsh sun, marble columns"
          - prompt: "xworld style, an old scientist in a lab coat and his teenage grandson working in a garage lab"
          - prompt: "xworld style, a dark castle city on a rocky mountain under a full moon at night, towers and walls"
          - prompt: "xworld style, close-up of a terrified old fisherman with a grey beard and a yellow raincoat, a storm wave rising behind him"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 30
meta:
  name: "xworld_style_v1"
  version: '1.0'
