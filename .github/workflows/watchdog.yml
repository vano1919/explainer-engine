# The watchdog outside the Claude session (docs/CLOUD_RUNBOOK.md CR-12; explainer_engine/cloud/watchdog.py).
# Every 10 minutes (GitHub may delay a schedule under load, and schedules run only from the default branch): stop any RunPod pod
# past the lifetime in its name or without one, stop a pod whose beat.txt on Hugging Face says DONE / FAILED / FAILED_UPLOAD /
# CAPPED / BAD_HOST or whose estimated spend reached its approved money (the live record runpod/live/<pod>.json), and report ERROR
# pods, stopped disks, network volumes, the 24 h billing against config/spend_caps.json and the balance. "Run workflow" with
# kill_all = true (GitHub Mobile works) is the creator's STOP ALL button: every live pod is stopped, nothing is deleted.
#
# Repository secrets: RUNPOD_API_KEY (exists), HF_TOKEN (write access to the vault dataset; without it the beats and the live
# records are not read, and a run with a live pod is red), NTFY_TOPIC for the push to the creator's phone.
# Nothing here hides a failure: a missing key, a failed stop and a push that did not arrive all make the run red.
name: RunPod watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      kill_all:
        description: "STOP ALL: stop every live pod now (never deletes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runpod-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The key must exist
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then echo "::error::no RUNPOD_API_KEY secret: nothing can be checked"; exit 1; fi
      - name: Stop every live pod (the creator's STOP ALL)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.kill_all }}
        run: python -m explainer_engine.cloud.watchdog --kill-all --yes
      - name: Watchdog pass (stop what the rules say, report what bills)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.kill_all) }}
        run: python -m explainer_engine.cloud.watchdog --apply
      - name: What bills now
        if: ${{ always() }}
        run: python -m explainer_engine.cloud.runpod check
