name: Quality checks

on:
  push:
    branches:
      - main
      - "systemic/**"
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-timeout ruff basedpyright
      - name: Lint code with Ruff
        run: ruff check explainer_engine/core/approvals.py explainer_engine/core/execution_gateway.py explainer_engine/core/spend_ledger.py explainer_engine/governance/gateway_hook.py explainer_engine/videolane/adapters.py explainer_engine/videolane/ltx_loop.py explainer_engine/overlay/bridge_compiler.py explainer_engine/qa/identity_lock.py explainer_engine/qa/perceptual_qa.py explainer_engine/audio/post_assembly_spotting.py tests/unit/test_production_framework_integration.py tests/unit/test_wave_next_framework.py tests/unit/test_episode_run.py tests/unit/test_wave10_audit_hardening.py
      - name: Type-check with BasedPyright
        run: basedpyright
      - name: Run production framework & governance integration tests
        run: PYTHONPATH=tests/unit:. python -m pytest -q tests/unit/test_production_framework_integration.py tests/unit/test_wave_next_framework.py tests/unit/test_governance_hooks.py tests/unit/test_episode_run.py tests/unit/test_wave10_audit_hardening.py
      - name: Run non-system tests
        run: python -m pytest -q -m "not system and not media"
      - name: Lint documentation and rules
        run: |
          python -m explainer_engine.docs_lint
          python -m explainer_engine.standards.sourced_rules check
          python -m explainer_engine.standards.craft check
          python -m explainer_engine.governance.agent_skills_lint
      - name: Check palette rules
        run: python -m explainer_engine.design.palette
