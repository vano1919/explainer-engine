# The pre-pod gate for the repository secrets (docs/CLOUD_RUNBOOK.md CR-19; explainer_engine/cloud/env_presence.py).
# Manual only ("Run workflow", GitHub Mobile works): it prints whether each secret the cloud workflows read is present and non-blank,
# never a value, and is red when one is missing. Not part of "quality": a pull request from a fork has no secrets and would be red.
# The names mapped below must be the names in env_presence.REQUIRED (tests/unit/test_cloud_env_presence.py keeps them together).
# Free: no pod, no API call, no money.
name: Secrets check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Which secrets exist (names only, never values)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m explainer_engine.cloud.env_presence
