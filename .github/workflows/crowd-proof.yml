name: Crowd proof (T-E)

# Overnight plan T-E (MOTION_RESEARCH.md Group 7, WP-M crowd): 5,000 Quaternius UBC soldiers as Geometry Nodes instances of baked
# UAL clips (T1 mid tier) and animated yaw billboards (T2 far tier), a few full rigs near the camera (T0), rendered as a 24-frame
# clip through the ICW-04 adapter (explainer_engine/blender/crowd.py -> bpy/render_shot.py -> bpy/crowd_bake.py). Fable asked for
# this CPU proof at scale 0.5 first; the full 2560x1440 clip runs on the creator's Mac. Free (D-114): a CPU runner, Mesa EGL, no
# GPU, no paid call. The CC0 assets are fetched from their source URLs and kept only at the registered sha256. CI timing is not a
# cost input (Group 7): s/frame here only shows the method runs; the Mac and a pod measure cost.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "soldiers in total"
        default: "5000"
      frames:
        description: "frames of the clip"
        default: "24"
      scale:
        description: "render scale of the 2560x1440 master (1.0, 0.75 or 0.5)"
        default: "0.5"
      look:
        description: "look variant (blender/look_variants.json id, or B_light)"
        default: "v01_reference_soft3d"
  push:
    branches:
      - "claude/project-thread-u1fc5g"
    paths:
      - "explainer_engine/blender/crowd.py"
      - "explainer_engine/blender/bpy/crowd_bake.py"
      - "explainer_engine/blender/bpy/render_shot.py"
      - ".github/workflows/crowd-proof.yml"

permissions:
  contents: read

concurrency:
  group: crowd-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowd:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the validator, Pillow, pytest and Blender's runtime libraries (Mesa EGL, no GPU)
        run: |
          python -m pip install "jsonschema==4.26.0" "pillow>=10.0" "numpy>=2.0" pytest
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libxi6 libxrender1 \
            libxfixes3 libxkbcommon0 libsm6 libxext6 libx11-6 fonts-dejavu-core ffmpeg
      - name: The crowd's unit tests (Group 7 tests 1-4 and 7)
        run: python -m pytest -q tests/unit/test_crowd.py
      - name: Read the Blender pin
        id: pin
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          b = json.load(open("config/cloud_pins.json"))["blender"]
          a = b["archives"]["linux-x64"]
          print(f"version={b['version']}")
          print(f"url={a['url']}")
          print(f"sha256={a['sha256']}")
          print(f"name={a['url'].rsplit('/', 1)[-1]}")
          PY
      - name: Cache the pinned archive (keyed by its sha256)
        uses: actions/cache@v4
        with:
          path: ~/blender-archive
          key: blender-${{ steps.pin.outputs.sha256 }}
      - name: Download the archive when it is not cached
        run: |
          mkdir -p ~/blender-archive
          f=~/blender-archive/${{ steps.pin.outputs.name }}
          [ -s "$f" ] || curl --fail --location --retry 3 --silent --show-error --output "$f" "${{ steps.pin.outputs.url }}"
      - name: Install Blender (refused unless the archive's sha256 is the pin)
        id: install
        run: |
          bin=$(python -m explainer_engine.blender.project install --dest "$RUNNER_TEMP/blender" \
                --archive ~/blender-archive/${{ steps.pin.outputs.name }} | tail -n 1)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          python -m explainer_engine.blender.project resolve --binary "$bin"
      - name: Cache the CC0 assets (keyed by the registered hashes)
        uses: actions/cache@v4
        with:
          path: tools/assets_cache
          key: crowd-assets-${{ hashFiles('explainer_engine/blender/style_sheet_assets.json', 'explainer_engine/blender/character_assets.json') }}
      - name: Fetch the CC0 assets and characters (kept only at the registered sha256)
        run: |
          python -m explainer_engine.blender.style_sheets fetch
          python -m explainer_engine.blender.characters fetch
      - name: Render the crowd clip
        run: |
          python -m explainer_engine.blender.crowd render --out crowd --binary "${{ steps.install.outputs.bin }}" \
            --count "${{ github.event.inputs.count || '5000' }}" --frames "${{ github.event.inputs.frames || '24' }}" \
            --scale "${{ github.event.inputs.scale || '0.5' }}" --look "${{ github.event.inputs.look || 'v01_reference_soft3d' }}"
      - name: Collect the outputs
        if: always()
        run: |
          mkdir -p crowd_artifact
          cp crowd/crowd_proof.json crowd/crowd_points.json crowd/*.mp4 crowd_artifact/ 2>/dev/null || true
          cp -r crowd/frames crowd_artifact/ 2>/dev/null || true
          for d in crowd/work/*/; do [ -f "$d/blender.log" ] && cp "$d/blender.log" "crowd_artifact/$(basename "$d").blender.log"; done || true
          for d in crowd/work/*/; do [ -f "$d/bpy_report.json" ] && cp "$d/bpy_report.json" crowd_artifact/; done || true
          cp crowd/crowd_atlas_preview.png crowd_artifact/ 2>/dev/null || true
          ls -la crowd_artifact
      - name: Upload the crowd proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowd-proof
          path: crowd_artifact/
          if-no-files-found: error
          retention-days: 30
