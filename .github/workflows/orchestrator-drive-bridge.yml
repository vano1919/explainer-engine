name: Orchestrator Drive Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - integration/explainer-engine-unification
    paths:
      - .github/workflows/orchestrator-drive-bridge.yml
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: orchestrator-drive-bridge
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EE_ANTHROPIC_API_KEY: ${{ secrets.EE_ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL1_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL1_TOKEN_SECRET || secrets.MODAL_TOKEN_SECRET }}
      MODAL1_TOKEN_ID: ${{ secrets.MODAL1_TOKEN_ID }}
      MODAL1_TOKEN_SECRET: ${{ secrets.MODAL1_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/explainer-engine-unification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch and validate active_task.json from Drive
        id: fetch
        run: |
          curl -fsSL -L "https://drive.google.com/uc?export=download&id=1HvWqPP4m8V1NcPy_SezxkeQwQ1x62iTO" -o /tmp/active_task.json
          python - <<'PY'
          import json, os, pathlib, re, sys

          ALLOWED_MODES = {
              "preflight-check",
              "opus-code",
              "deepseek-code",
              "deepseek-review",
              "e2e-perceptual-qa",
          }
          TID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$")

          raw = pathlib.Path("/tmp/active_task.json").read_text(encoding="utf-8")
          if len(raw) > 256_000:
              sys.exit("active_task.json exceeds 256 KB size limit")
          task = json.loads(raw)
          if not isinstance(task, dict):
              sys.exit("active_task.json must be a JSON object")

          tid = str(task.get("task_id", ""))
          if not TID_RE.fullmatch(tid):
              sys.exit(f"Invalid task_id (must match {TID_RE.pattern}): {tid!r}")

          mode = str(task.get("mode", ""))
          if mode not in ALLOWED_MODES:
              sys.exit(f"Unsupported task mode: {mode!r}; allowed={sorted(ALLOWED_MODES)}")

          results_root = pathlib.Path("docs/orchestrator/results").resolve()
          result_file = (results_root / f"{tid}.json").resolve()
          if not result_file.is_relative_to(results_root):
              sys.exit(f"Result path escapes results root: {result_file}")

          done = result_file.exists()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"task_id={tid}\n")
              f.write(f"already_done={'true' if done else 'false'}\n")
          print(f"Validated task_id={tid}, mode={mode}, already_done={done}")
          PY
      - name: Install FFmpeg and dependencies
        if: steps.fetch.outputs.already_done == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          python -m pip install -r requirements.txt -q
      - name: Execute Drive task
        id: execute
        if: steps.fetch.outputs.already_done == 'false'
        run: |
          python - <<'PY'
          import json, os, pathlib, re, sys
          from subprocess import run as exec_cmd

          REPO_ROOT = pathlib.Path.cwd().resolve()
          TID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$")
          CARD_REF_RE = re.compile(r"^cmsg_[A-Za-z0-9_-]{4,80}$")
          TEST_PROFILES = {
              "preflight": "python -m pytest -q -m 'not system and not media'",
              "sourced-rules": "python -m pytest -q tests/unit/test_sourced_rules.py tests/unit/test_sourced_rules_sync.py",
              "orchestration": "python -m pytest -q tests/unit/test_skill_orchestrator.py tests/unit/test_crash_recovery.py tests/unit/test_perceptual_qa.py",
              "budgets": "python -m pytest -q tests/unit/test_wave1_budgets_and_tokens.py tests/unit/test_spend_caps.py",
          }

          def safe_repo_path(raw_path: str, *, must_exist: bool = True) -> pathlib.Path:
              if not isinstance(raw_path, str) or not raw_path.strip():
                  raise ValueError("empty path")
              p = pathlib.Path(raw_path)
              if p.is_absolute():
                  raise ValueError(f"absolute paths are forbidden: {raw_path!r}")
              resolved = (REPO_ROOT / p).resolve()
              if not resolved.is_relative_to(REPO_ROOT):
                  raise ValueError(f"path escapes repository root: {raw_path!r}")
              if must_exist and not resolved.exists():
                  raise ValueError(f"path does not exist: {raw_path!r}")
              return resolved

          task = json.loads(pathlib.Path("/tmp/active_task.json").read_text(encoding="utf-8"))
          tid = str(task["task_id"])
          if not TID_RE.fullmatch(tid):
              sys.exit(f"Invalid task_id: {tid!r}")
          mode = str(task["mode"])

          out_dir = (REPO_ROOT / "docs/orchestrator/results").resolve()
          task_dir = (out_dir / tid).resolve()
          if not task_dir.is_relative_to(out_dir):
              sys.exit(f"Task dir escapes results root: {task_dir}")
          task_dir.mkdir(parents=True, exist_ok=True)
          result = {"task_id": tid, "mode": mode, "exit_code": 1}

          if task.get("brief_text"):
              briefs_root = (REPO_ROOT / "docs/orchestrator/briefs").resolve()
              bp = (briefs_root / f"{tid}.md").resolve()
              if not bp.is_relative_to(briefs_root):
                  sys.exit(f"Brief path escapes briefs root: {bp}")
              bp.parent.mkdir(parents=True, exist_ok=True)
              bp.write_text(str(task["brief_text"]), encoding="utf-8")
              brief_path = str(bp.relative_to(REPO_ROOT))
          elif task.get("brief_path"):
              brief_path = str(safe_repo_path(task["brief_path"]).relative_to(REPO_ROOT))
          else:
              brief_path = ""

          if mode == "preflight-check":
              names = [
                  "ANTHROPIC_API_KEY", "EE_ANTHROPIC_API_KEY", "DEEPSEEK_API_KEY",
                  "MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET", "MODAL1_TOKEN_ID", "MODAL1_TOKEN_SECRET",
                  "HF_TOKEN", "HUGGING_FACE_HUB_TOKEN", "GEMINI_API_KEY", "ELEVENLABS_API_KEY"
              ]
              result["secrets_present"] = {n: bool(os.environ.get(n)) for n in names}
              p1 = exec_cmd([sys.executable, "-m", "explainer_engine.docs_lint"], capture_output=True, text=True)
              p2 = exec_cmd([sys.executable, "-m", "pytest", "-q", "-m", "not system and not media"], capture_output=True, text=True)
              result["docs_lint_rc"] = p1.returncode
              result["docs_lint_tail"] = (p1.stdout + p1.stderr)[-1000:]
              result["pytest_rc"] = p2.returncode
              result["pytest_tail"] = (p2.stdout + p2.stderr)[-2000:]
              result["exit_code"] = 0 if (p1.returncode == 0 and p2.returncode == 0) else 1
          elif mode in ("opus-code", "deepseek-code"):
              if not brief_path:
                  raise ValueError(f"{mode} requires brief_text or brief_path")
              mod = "explainer_engine.llm.opus_code" if mode == "opus-code" else "explainer_engine.llm.deepseek_api"
              cmd = [sys.executable, "-m", mod, "code", "--brief", brief_path, "--max-usd", str(float(task["max_usd"])), "--out", str(task_dir)]
              if task.get("files"):
                  safe_files = [str(safe_repo_path(f).relative_to(REPO_ROOT)) for f in task["files"]]
                  cmd += ["--files"] + safe_files
              if task.get("test_profile"):
                  prof = str(task["test_profile"])
                  if prof not in TEST_PROFILES:
                      raise ValueError(f"Unsupported test_profile: {prof!r}")
                  cmd += ["--test", TEST_PROFILES[prof]]
              if task.get("max_tokens"):
                  cmd += ["--max-tokens", str(int(task["max_tokens"]))]
              if mode == "deepseek-code" and task.get("model"):
                  cmd += ["--model", str(task["model"])]
              if mode == "opus-code":
                  cmd += ["--task-class", str(task.get("task_class", "new-method-code"))]
                  card_ref = str(task.get("card_ref", ""))
                  if not task.get("dry_run", True) and not CARD_REF_RE.fullmatch(card_ref):
                      raise ValueError("Live opus-code requires an explicit valid card_ref (cmsg_...); hardcoded fallbacks are forbidden")
                  if card_ref:
                      cmd += ["--card-ref", card_ref]
              if task.get("dry_run", True):
                  cmd += ["--dry-run"]
              p = exec_cmd(cmd, capture_output=True, text=True)
              result["exit_code"] = p.returncode
              result["stdout"] = p.stdout[-4000:]
              result["stderr"] = p.stderr[-2000:]
              # Always keep working tree clean; patches remain in task_dir/patch.diff for human review
              exec_cmd(["git", "checkout", "--", "."], check=False)
          elif mode == "deepseek-review":
              if not brief_path:
                  raise ValueError("deepseek-review requires brief_text or brief_path")
              diff_rel = str(safe_repo_path(task["diff_path"]).relative_to(REPO_ROOT))
              cmd = [
                  sys.executable, "-m", "explainer_engine.llm.deepseek_api", "review",
                  "--brief", brief_path, "--diff", diff_rel,
                  "--max-usd", str(float(task["max_usd"])), "--model", str(task.get("model", "pro")),
                  "--out", str(task_dir)
              ]
              if task.get("dry_run", True):
                  cmd += ["--dry-run"]
              p = exec_cmd(cmd, capture_output=True, text=True)
              result["exit_code"] = p.returncode
              result["stdout"] = p.stdout[-4000:]
              result["stderr"] = p.stderr[-2000:]
          elif mode == "e2e-perceptual-qa":
              vid_rel = str(safe_repo_path(task["video_path"]).relative_to(REPO_ROOT))
              cmd = [
                  sys.executable, "-m", "explainer_engine.qa.perceptual_qa",
                  "--video", vid_rel, "--out", str(task_dir / "perceptual_qa_report.json")
              ]
              if task.get("use_gemini", True):
                  cmd += ["--gemini"]
              p = exec_cmd(cmd, capture_output=True, text=True)
              result["exit_code"] = p.returncode
              result["stdout"] = p.stdout[-4000:]
              result["stderr"] = p.stderr[-2000:]
          else:
              result["exit_code"] = 2
              result["error"] = f"Unsupported mode: {mode!r}"

          result_file = (out_dir / f"{tid}.json").resolve()
          if not result_file.is_relative_to(out_dir):
              sys.exit("Result file escapes output directory")
          result_file.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          sys.exit(int(result["exit_code"]))
          PY
      - name: Commit orchestrator result artifact
        if: always() && steps.fetch.outputs.already_done == 'false' && steps.fetch.outputs.task_id != ''
        env:
          TASK_ID: ${{ steps.fetch.outputs.task_id }}
        run: |
          export GIT_AUTHOR_NAME="vano1919"
          export GIT_AUTHOR_EMAIL="122537395+vano1919@users.noreply.github.com"
          export GIT_COMMITTER_NAME="vano1919"
          export GIT_COMMITTER_EMAIL="122537395+vano1919@users.noreply.github.com"
          git add docs/orchestrator/results/ docs/orchestrator/briefs/
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "chore(orchestrator): result for ${TASK_ID} [skip ci]"
            git push origin HEAD:integration/explainer-engine-unification
          fi
