name: Orchestrator Manual Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Diagnostic mode (read-only / offline)"
        type: choice
        required: true
        default: "preflight-check"
        options:
          - preflight-check
          - e2e-perceptual-qa-offline
      video_path:
        description: "Repository-relative video path (used only for e2e-perceptual-qa-offline)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: orchestrator-manual-diagnostics
  cancel-in-progress: false

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and project dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          python -m pip install -r requirements.txt -q
      - name: Execute validated offline diagnostic
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          ALLOWED_MODES = {"preflight-check", "e2e-perceptual-qa-offline"}
          ALLOWED_VIDEO_EXTS = {".mp4", ".mov", ".mkv", ".webm"}
          REPO_ROOT = pathlib.Path.cwd().resolve()
          OUT_DIR = pathlib.Path("/tmp/orchestrator_diag_out")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          mode = os.environ.get("INPUT_MODE", "").strip()
          if mode not in ALLOWED_MODES:
              sys.exit(f"Unsupported mode: {mode!r}; allowed={sorted(ALLOWED_MODES)}")

          result = {"mode": mode, "exit_code": 1}

          if mode == "preflight-check":
              p1 = subprocess.run(
                  [sys.executable, "-m", "explainer_engine.docs_lint"],
                  capture_output=True,
                  text=True,
              )
              p2 = subprocess.run(
                  [sys.executable, "-m", "explainer_engine.standards.sourced_rules", "check"],
                  capture_output=True,
                  text=True,
              )
              p3 = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "tests/unit"],
                  capture_output=True,
                  text=True,
              )
              result["docs_lint_rc"] = p1.returncode
              result["sourced_rules_rc"] = p2.returncode
              result["pytest_rc"] = p3.returncode
              result["pytest_tail"] = (p3.stdout + p3.stderr)[-2000:]
              result["exit_code"] = 0 if (p1.returncode == 0 and p2.returncode == 0 and p3.returncode == 0) else 1
          elif mode == "e2e-perceptual-qa-offline":
              raw_vid = os.environ.get("INPUT_VIDEO_PATH", "").strip()
              if not raw_vid or len(raw_vid) > 256:
                  sys.exit("video_path is required and must be <= 256 chars")
              p = pathlib.Path(raw_vid)
              if p.is_absolute():
                  sys.exit(f"Absolute video_path is forbidden: {raw_vid!r}")
              resolved = (REPO_ROOT / p).resolve()
              if not resolved.is_relative_to(REPO_ROOT) or not resolved.is_file():
                  sys.exit(f"video_path must be an existing file inside repo root: {raw_vid!r}")
              if resolved.suffix.lower() not in ALLOWED_VIDEO_EXTS:
                  sys.exit(f"Unsupported video extension: {resolved.suffix!r}")
              report_path = OUT_DIR / "perceptual_qa_report.json"
              proc = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "explainer_engine.qa.perceptual_qa",
                      "--video",
                      str(resolved),
                      "--out-dir",
                      str(OUT_DIR),
                  ],
                  capture_output=True,
                  text=True,
              )
              result["exit_code"] = proc.returncode
              result["stdout"] = proc.stdout[-4000:]
              result["stderr"] = proc.stderr[-2000:]

          (OUT_DIR / "result.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          sys.exit(int(result["exit_code"]))
          PY
      - name: Upload diagnostic result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-diagnostic-result
          path: /tmp/orchestrator_diag_out/
