name: Blender smoke

# ICW-04 (roadmap 12.4 step 1, BP-175): the pinned Blender 5.2.3 LTS starts headless on a CPU-only runner and renders an 8-frame
# shot_spec/2 with the Workbench engine at 320x180 through the production adapter (explainer_engine/blender/render.py): the
# archive is checked against the sha256 of config/cloud_pins.json, every frame goes RENDERED -> DURABLY_STORED -> COMMITTED on a
# local stand-in vault, and the frames, the render manifest and the Blender log are kept as an artifact. ICW-06 adds a second
# smoke: one rigged character (the free CC0 Quaternius packs, fetched by their sha256 from itch.io) walking under a camera rail,
# with its blender_scene_manifest/1. Free: no pod, no paid call.

on:
  push:
    branches:
      - "icw/**"
      - "opus/ink-chronicle-**"
    paths:
      - "explainer_engine/blender/**"
      - "explainer_engine/core/contracts.py"
      - "explainer_engine/schemas/shot_spec.schema.json"
      - "explainer_engine/schemas/blender_render_manifest.schema.json"
      - "explainer_engine/schemas/render_checkpoint.schema.json"
      - "config/cloud_pins.json"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "explainer_engine/blender/**"
      - "explainer_engine/core/contracts.py"
      - "explainer_engine/schemas/shot_spec.schema.json"
      - "explainer_engine/schemas/blender_render_manifest.schema.json"
      - "explainer_engine/schemas/render_checkpoint.schema.json"
      - "config/cloud_pins.json"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the contract validator, Pillow and Blender's runtime libraries (Mesa EGL, no GPU)
        run: |
          python -m pip install "jsonschema==4.26.0" "pillow==12.3.0"  # pillow: the character smoke reads texture means
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libxi6 libxrender1 \
            libxfixes3 libxkbcommon0 libsm6 libxext6 libx11-6
      - name: Read the Blender pin
        id: pin
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          b = json.load(open("config/cloud_pins.json"))["blender"]
          a = b["archives"]["linux-x64"]
          print(f"version={b['version']}")
          print(f"url={a['url']}")
          print(f"sha256={a['sha256']}")
          print(f"name={a['url'].rsplit('/', 1)[-1]}")
          PY
      - name: Cache the pinned archive (keyed by its sha256)
        uses: actions/cache@v4
        with:
          path: ~/blender-archive
          key: blender-${{ steps.pin.outputs.sha256 }}
      - name: Download the archive when it is not cached
        run: |
          mkdir -p ~/blender-archive
          f=~/blender-archive/${{ steps.pin.outputs.name }}
          [ -s "$f" ] || curl --fail --location --retry 3 --silent --show-error --output "$f" "${{ steps.pin.outputs.url }}"
          ls -l "$f"
      - name: Install Blender (refused unless the archive's sha256 is the pin)
        id: install
        run: |
          bin=$(python -m explainer_engine.blender.project install --dest "$RUNNER_TEMP/blender" \
                --archive ~/blender-archive/${{ steps.pin.outputs.name }} | tail -n 1)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          python -m explainer_engine.blender.project resolve --binary "$bin"
      - name: Render the 8-frame Workbench smoke (320x180)
        run: python -m explainer_engine.blender.render smoke --out smoke --binary "${{ steps.install.outputs.bin }}"
      - name: EEVEE API names on the pinned Blender (WP-Q0; BLENDER_EEVEE, use_fast_gi, no use_gtao)
        run: |
          "${{ steps.install.outputs.bin }}" --background --factory-startup --python-exit-code 1 \
            --python explainer_engine/blender/bpy/check_eevee_api.py | tee eevee_api.txt
          grep -q '^APPLIED ' eevee_api.txt
      - name: Check the frames
        run: |
          python - <<'PY'
          import glob, json
          from explainer_engine.blender.render import check_png
          s = json.load(open("smoke/smoke_summary.json"))
          frames = sorted(glob.glob(s["frames_dir"] + "/frame_*.png"))
          assert len(frames) == 8, frames
          bad = {f: check_png(f, 320, 180) for f in frames if check_png(f, 320, 180)}
          assert not bad, bad
          assert len({open(f, "rb").read() for f in frames}) == 8, "the camera moves: no two frames are equal"
          assert s["engine"] == "workbench" and s["frames_written"] == 8 and s["output"]["codec"] == "png", s
          assert all(f["rule"] == "CN-17" and "master" in f["detail"] for f in s["findings"] if f["severity"] == "FAIL"), s["findings"]
          print(json.dumps(s, indent=1))
          PY
      - name: Cache the free CC0 character packs (keyed by their sha256)
        uses: actions/cache@v4
        with:
          path: tools/assets_cache/packs
          key: character-packs-${{ hashFiles('explainer_engine/blender/character_assets.json') }}
      - name: Render the character smoke (ICW-06; one rigged character on a camera rail, Workbench, 8 frames, 320x180)
        run: |
          python -m explainer_engine.blender.characters fetch
          python -m explainer_engine.blender.scene_builder smoke --out char_smoke --binary "${{ steps.install.outputs.bin }}"
      - name: Check the character frames and the scene manifest
        run: |
          python - <<'PY'
          import glob, json
          from explainer_engine.blender.render import check_png
          s = json.load(open("char_smoke/smoke_summary.json"))
          frames = sorted(glob.glob(s["frames_dir"] + "/frame_*.png"))
          assert len(frames) == 8 and not any(check_png(f, 320, 180) for f in frames), frames
          assert len({open(f, "rb").read() for f in frames}) == 8, "the rail moves the camera: no two frames are equal"
          assert list(s["characters"]) == ["walker"] and s["actions"], s
          assert s["objects"]["armatures"] == 1 and s["camera_keys"] == 3 and not s["findings"], s
          m = json.load(open(s["scene_manifest"]))
          assert m["schema"] == "blender_scene_manifest/1" and any(a["id"] == "animation.ual1_standard" for a in m["assets"])
          print(json.dumps(s, indent=1))
          PY
      - name: Render the named camera setups as Add Camera Rigs clips (WP-Q7; 48 frames each, Workbench, 960x540)
        run: python -m explainer_engine.blender.camera_smoke --out camera_smoke --binary "${{ steps.install.outputs.bin }}" --frames 48
      - name: Render the J5 2.5D assembly smoke (D-116, ICW-11; 4 dialogue shots + a 30-degree pan, EEVEE, 320x180)
        run: |
          python -m pip install "numpy>=2.0"
          python -m explainer_engine.blender.assemble_25d smoke --out assemble_smoke --binary "${{ steps.install.outputs.bin }}" \
            --size 320x180 --seconds 0.5 --samples 4
      - name: Collect the outputs
        if: always()
        run: |
          mkdir -p smoke_artifact
          cp -r smoke/work/*/frames smoke_artifact/ 2>/dev/null || true
          mkdir -p smoke_artifact/character
          cp -r char_smoke/work/*/frames char_smoke/smoke_summary.json char_smoke/work/*/scene_manifest.json \
             char_smoke/work/*/bpy_report.json char_smoke/work/*/blender.log smoke_artifact/character/ 2>/dev/null || true
          cp smoke/smoke_summary.json smoke/work/*/render_manifest.json smoke/work/*/render_checkpoint.json smoke/work/*/blender.log \
             smoke/work/*/bpy_report.json smoke_artifact/ 2>/dev/null || true
          mkdir -p smoke_artifact/cameras
          cp -r camera_smoke/* smoke_artifact/cameras/ 2>/dev/null || true
          mkdir -p smoke_artifact/assemble_25d
          cp -r assemble_smoke/smoke_summary.json assemble_smoke/J5-* smoke_artifact/assemble_25d/ 2>/dev/null || true
          ls -la smoke_artifact
      - name: Upload the smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-smoke-${{ steps.pin.outputs.version }}-${{ github.sha }}
          path: smoke_artifact/
          if-no-files-found: error
          retention-days: 14
