name: Modal LTX Smoke + Gemini QA

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "LTX scene plan JSON path"
        required: true
        default: "explainer_engine/training/pods/ltx/scenes/battle_2026-11-12.json"
      picture_path:
        description: "Start keyframe PNG path"
        required: true
        default: "assets/style/main_style_5709.png"

permissions:
  contents: read

concurrency:
  group: modal-ltx-smoke-qa
  cancel-in-progress: false

jobs:
  ltx-smoke-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL1_TOKEN_ID: ${{ secrets.MODAL1_TOKEN_ID }}
      MODAL1_TOKEN_SECRET: ${{ secrets.MODAL1_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg, project dependencies, and Modal CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          python -m pip install -r requirements.txt modal -q
      - name: Run MODAL1 LTX L0-L3 smoke + Gemini multimodal QA
        run: |
          python scripts/run_modal_ltx_smoke_and_qa.py \
            --plan "${{ inputs.plan_path }}" \
            --picture "${{ inputs.picture_path }}" \
            --out-dir /tmp/ltx_smoke_out
      - name: Upload smoke clip and Gemini QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-ltx-smoke-and-qa
          path: /tmp/ltx_smoke_out/
